# Публикация на GitHub Pages.
#
# Включается вручную: Settings → Pages → Source: "Deploy from a branch",
# ветка main, папка /(root). Файл .nojekyll уже в репозитории.
#
# Автоматический вариант ниже требует, чтобы Pages был включён и токен
# рабочего процесса имел pages: write. Если сайт ещё не создан,
# configure-pages падает с 403 — это ограничение прав приложения,
# а не ошибка в сайте.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
